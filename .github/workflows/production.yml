name: Promote verified staging to production

on:
  workflow_run:
    workflows: ['Test, publish and deploy staging']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_sha:
        description: 'Full 40-character commit SHA currently verified on staging'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: swe40006-production
  cancel-in-progress: false

jobs:
  production:
    name: Promote the verified image and check production
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.event == 'push' ||
         github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      CANDIDATE_SHA: ${{ inputs.image_sha || github.event.workflow_run.head_sha }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      RELEASE_TRIGGER: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_sha || github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deployment clients
        run: pip install 'boto3>=1.35,<2' requests==2.34.2
      - name: Require successful staging before promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: python deploy/validate_release.py
      - name: Authenticate for production only
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: arn:aws:iam::612153306600:role/SWE40006-GitHub-Production-Deploy
          aws-region: ap-southeast-2
          role-duration-seconds: 900
      - name: Promote the exact same immutable image
        run: |
          INSTANCE=$(python -c 'import json; print(json.load(open("deploy/environments.json"))["environments"]["production"]["instance_id"])')
          python deploy/ssm_deploy.py --instance "$INSTANCE" --sha "$CANDIDATE_SHA" --output deployment-evidence/production-ssm.json
      - name: Verify production HTTPS and task workflow
        run: |
          URL=$(python -c 'import json; print(json.load(open("deploy/environments.json"))["environments"]["production"]["url"])')
          python deploy/smoke.py --url "$URL" --sha "$CANDIDATE_SHA" --environment production --output deployment-evidence/production-smoke.json
          printf '### Production release verified\n\nURL: %s\n\nCommit: `%s`\n\nTrigger: `%s`\n\nSuccessful source CI/staging run: `%s`\n' "$URL" "$CANDIDATE_SHA" "$RELEASE_TRIGGER" "${SOURCE_RUN_ID:-manual fallback}" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain production deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-deployment-evidence
          path: deployment-evidence/
          if-no-files-found: warn
