name: Test, publish and deploy staging

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swe40006-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: taskmanager_test
          MARIADB_USER: taskmanager_test
          MARIADB_PASSWORD: isolated-ci-test-password
          MARIADB_ROOT_PASSWORD: isolated-ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: development
      TEST_DATABASE_URL: mysql+pymysql://taskmanager_test:isolated-ci-test-password@127.0.0.1:3306/taskmanager_test?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium --only-shell
      - name: Run API, MariaDB and browser tests
        run: python -m pytest --cov=taskmanager --cov-report=term-missing --cov-report=xml --cov-fail-under=80 --junitxml=test-results/junit.xml --screenshot=only-on-failure --tracing=retain-on-failure
      - name: Build verified application image
        run: docker build -t swe40006-project:${{ github.sha }} .
      - name: Build matching complete-suite image for staging EC2
        run: docker build -f deploy/Dockerfile.tests -t swe40006-tests:${{ github.sha }} .
      - name: Authenticate to AWS with short-lived credentials
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: arn:aws:iam::612153306600:role/SWE40006-GitHub-ECR-Push
          aws-region: ap-southeast-2
          role-duration-seconds: 900
      - name: Publish tested image to Amazon ECR
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          AWS_REGION: ap-southeast-2
          ECR_REPOSITORY: swe40006-taskmanager
          ECR_REGISTRY: 612153306600.dkr.ecr.ap-southeast-2.amazonaws.com
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "612153306600"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$GITHUB_SHA" >/dev/null 2>&1; then
            echo "The immutable image for this commit already exists."
          else
            docker tag "swe40006-project:$GITHUB_SHA" "$IMAGE_URI"
            docker push "$IMAGE_URI"
          fi
          TEST_IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:test-$GITHUB_SHA"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=test-$GITHUB_SHA" >/dev/null 2>&1; then
            echo "The immutable test image for this commit already exists."
          else
            docker tag "swe40006-tests:$GITHUB_SHA" "$TEST_IMAGE_URI"
            docker push "$TEST_IMAGE_URI"
          fi
          aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=test-$GITHUB_SHA" --query 'imageDetails[0].{digest:imageDigest,tags:imageTags,pushedAt:imagePushedAt}' --output json > test-image-evidence.json
          printf '%s\n' "$IMAGE_URI" > image-uri.txt
          aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$GITHUB_SHA" --query 'imageDetails[0].{digest:imageDigest,tags:imageTags,pushedAt:imagePushedAt}' --output json > image-evidence.json
          printf '### Published application image\n\n`%s`\n' "$IMAGE_URI" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain image version evidence
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: published-image
          path: |
            image-uri.txt
            image-evidence.json
            test-image-evidence.json
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            coverage.xml
            test-results/
          if-no-files-found: warn

  staging:
    name: Deploy, run full suite on EC2 and verify staging
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deployment clients
        run: pip install 'boto3>=1.35,<2' requests==2.34.2
      - name: Authenticate for staging only
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: arn:aws:iam::612153306600:role/SWE40006-GitHub-Staging-Deploy
          aws-region: ap-southeast-2
          role-duration-seconds: 900
      - name: Deploy and run unit, integration and browser tests on staging EC2
        run: |
          INSTANCE=$(python -c 'import json; print(json.load(open("deploy/environments.json"))["environments"]["staging"]["instance_id"])')
          python deploy/ssm_deploy.py --instance "$INSTANCE" --sha "$GITHUB_SHA" --output deployment-evidence/staging-ssm.json
          python -c 'import json,os; r=json.load(open("deployment-evidence/staging-tests/result.json")); assert r["status"] == "passed" and r["sha"] == os.environ["GITHUB_SHA"] and r["instance_id"] == "i-088f4da7f4434ea8e"; print("EC2 full suite verified:",r["tests"],"tests; coverage",r["coverage_percent"],"%")'
      - name: Verify staging HTTPS and task workflow
        run: |
          URL=$(python -c 'import json; print(json.load(open("deploy/environments.json"))["environments"]["staging"]["url"])')
          python deploy/smoke.py --url "$URL" --sha "$GITHUB_SHA" --environment staging --output deployment-evidence/staging-smoke.json
          printf '### Staging release verified\n\nURL: %s\n\nCommit: `%s`\n\nComplete Pytest/API/Chromium suite passed on staging EC2 with an isolated MariaDB test database. Production is promoted automatically after this workflow succeeds.\n' "$URL" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          python -c 'import json,os; r=json.load(open("deployment-evidence/staging-tests/result.json")); open(os.environ["GITHUB_STEP_SUMMARY"],"a").write("\nEC2 instance: `"+r["instance_id"]+"`\n\nTests: "+str(r["tests"])+"; coverage: "+str(r["coverage_percent"])+"%\n\nExecution: "+r["started_at_utc"]+" to "+r["finished_at_utc"]+"\n")'
      - name: Retain staging deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-deployment-evidence
          path: deployment-evidence/
          if-no-files-found: warn
