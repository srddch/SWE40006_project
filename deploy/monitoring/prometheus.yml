global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']
scrape_configs:
  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']
        labels: {environment: production}
  - job_name: taskmanager
    static_configs:
      - targets: ['127.0.0.1:8000']
        labels: {environment: production}
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
  - job_name: https-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['https://swe40006-production-3-24-70-105.sslip.io/health']
        labels: {environment: production}
      - targets: ['https://swe40006-staging-13-237-171-201.sslip.io/health']
        labels: {environment: staging}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
