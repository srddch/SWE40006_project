groups:
  - name: swe40006
    rules:
      - alert: WebsiteUnavailable
        expr: probe_success{job="https-health"} == 0
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: '{{ $labels.environment }} HTTPS or database health check failed'
      - alert: ApplicationMetricsUnavailable
        expr: up{job="taskmanager"} == 0
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: Production application metrics unavailable
      - alert: HighCPU
        expr: 100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 85
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'CPU usage above 85% for five minutes'}
      - alert: HighMemory
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'Available host memory below 10% for five minutes'}
      - alert: DiskSpaceLow
        expr: node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"} < 0.15
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'Root disk free space below 15%'}
