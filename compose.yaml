services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_NAME:-taskmanager}
      MARIADB_USER: ${DB_USER:-taskmanager}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Run scripts/setup_local.py first}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run scripts/setup_local.py first}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  web:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:?Run scripts/setup_local.py first}
      DATABASE_URL: mysql+pymysql://${DB_USER:-taskmanager}:${DB_PASSWORD}@db:3306/${DB_NAME:-taskmanager}?charset=utf8mb4
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  mariadb_data:
